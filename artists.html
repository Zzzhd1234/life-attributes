<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpeakUp · Artists</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080808;
  --surface: #111;
  --surface2: #1a1a1a;
  --surface3: #222;
  --border: rgba(255,255,255,.07);
  --border2: rgba(255,255,255,.12);
  --accent: #6c63ff;
  --accent-low: rgba(108,99,255,.14);
  --text: #f0f0f0;
  --text2: rgba(240,240,240,.55);
  --text3: rgba(240,240,240,.3);
  --green: #1ed760;
  --red: #ff5f72;
  --r: 12px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.5; }
button { font-family: inherit; cursor: pointer; }
input, textarea { font-family: inherit; }

/* ── SITE HEADER ── */
.site-header {
  position: sticky; top: 0; z-index: 200;
  height: 62px; background: rgba(8,8,8,.9); backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 40px; gap: 28px;
}
.brand { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.brand-logo { font-size: 1.3rem; }
.brand-name { font-size: 1rem; font-weight: 700; letter-spacing: -.02em; white-space: nowrap; }
.brand-name em { font-style: normal; color: var(--accent); }
.header-search { flex: 1; max-width: 340px; position: relative; }
.header-search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); opacity: .35; pointer-events: none; }
.search-in {
  width: 100%; background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 14px 8px 38px; color: var(--text);
  font-size: .88rem; outline: none; transition: border-color .2s;
}
.search-in:focus { border-color: rgba(108,99,255,.5); }
.search-in::placeholder { color: var(--text3); }
.header-nav { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.nav-btn {
  background: none; border: 1px solid var(--border2); color: var(--text2);
  padding: 6px 16px; border-radius: 7px; font-size: .83rem; font-weight: 500;
  transition: all .15s;
}
.nav-btn:hover { background: var(--surface2); color: var(--text); }
.nav-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

/* ── VIEWS ── */
.view { display: none; }
.view.active { display: block; }

/* ── LIST VIEW ── */
.list-wrap { max-width: 1280px; margin: 0 auto; padding: 52px 40px 100px; }
.list-heading { margin-bottom: 44px; }
.list-heading h1 { font-size: 2.4rem; font-weight: 800; letter-spacing: -.05em; margin-bottom: 10px; }
.list-heading p { color: var(--text2); font-size: .95rem; max-width: 480px; }

.artist-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; }

.artist-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 16px; padding: 28px 28px 24px; cursor: pointer;
  transition: border-color .2s, transform .2s, box-shadow .2s;
  position: relative; overflow: hidden;
}
.artist-card::after {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: var(--c, var(--accent)); opacity: .85;
}
.artist-card:hover { border-color: var(--c, var(--accent)); transform: translateY(-4px); box-shadow: 0 16px 48px rgba(0,0,0,.5); }
.ac-avatar { font-size: 3.2rem; margin-bottom: 18px; line-height: 1; }
.ac-name { font-size: 1.35rem; font-weight: 800; letter-spacing: -.03em; margin-bottom: 4px; }
.ac-sub { font-size: .78rem; color: var(--text3); margin-bottom: 12px; letter-spacing: .01em; }
.ac-desc {
  font-size: .84rem; color: var(--text2); line-height: 1.65; margin-bottom: 18px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.ac-stats { display: flex; gap: 18px; }
.ac-stat { font-size: .8rem; color: var(--text3); }
.ac-stat b { color: var(--text); font-weight: 600; }

.no-results { text-align: center; padding: 80px 24px; color: var(--text3); font-size: .9rem; display: none; }

/* ── DETAIL VIEW ── */
.detail-header {
  position: sticky; top: 62px; z-index: 150;
  background: rgba(8,8,8,.88); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  height: 50px; display: flex; align-items: center; padding: 0 40px; gap: 14px;
}
.back-btn {
  display: flex; align-items: center; gap: 6px;
  background: none; border: none; color: var(--text2); font-size: .88rem; font-weight: 500;
  padding: 5px 10px; border-radius: 7px; transition: background .15s, color .15s;
}
.back-btn:hover { background: var(--surface2); color: var(--text); }
.breadcrumb { font-size: .85rem; color: var(--text3); }
.sep { color: var(--text3); font-size: .75rem; }

.hero-wrap {
  background: linear-gradient(180deg, var(--surface) 0%, transparent 100%);
  border-bottom: 1px solid var(--border);
}
.hero-inner { max-width: 1280px; margin: 0 auto; padding: 44px 40px 36px; display: flex; gap: 36px; }
.hero-avatar {
  width: 108px; height: 108px; border-radius: 50%;
  background: var(--surface2); display: flex; align-items: center; justify-content: center;
  font-size: 3.4rem; flex-shrink: 0; box-shadow: 0 0 0 3px var(--c, var(--accent));
}
.hero-info { flex: 1; }
.hero-name { font-size: 2.4rem; font-weight: 800; letter-spacing: -.05em; margin-bottom: 6px; }
.hero-sub { font-size: .88rem; color: var(--text2); margin-bottom: 12px; }
.hero-desc { font-size: .88rem; color: var(--text2); line-height: 1.75; max-width: 600px; margin-bottom: 16px; }
.tag-row { display: flex; gap: 8px; flex-wrap: wrap; }
.tag { padding: 4px 14px; border-radius: 20px; font-size: .75rem; background: var(--surface3); color: var(--text2); border: 1px solid var(--border); }

/* ── COLUMNS ── */
.detail-body { max-width: 1280px; margin: 0 auto; padding: 36px 40px 100px; display: grid; grid-template-columns: 400px 1fr; gap: 36px; align-items: start; }

/* songs column */
.col-songs { position: sticky; top: 112px; max-height: calc(100vh - 130px); overflow-y: auto; }
.col-songs::-webkit-scrollbar { width: 4px; }
.col-songs::-webkit-scrollbar-track { background: transparent; }
.col-songs::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 4px; }

.col-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.col-title { font-size: 1rem; font-weight: 700; letter-spacing: -.01em; }
.col-count { font-size: .8rem; color: var(--text3); font-weight: 400; }

.song-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 10px; overflow: hidden; }
.song-header { display: flex; align-items: center; gap: 14px; padding: 14px 16px; cursor: pointer; transition: background .15s; }
.song-header:hover { background: var(--surface2); }
.song-icon { width: 42px; height: 42px; border-radius: 8px; background: rgba(30,215,96,.1); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; flex-shrink: 0; }
.song-info { flex: 1; min-width: 0; }
.song-title { font-weight: 600; font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.song-meta { font-size: .74rem; color: var(--text3); margin-top: 2px; }
.song-chevron { color: var(--text3); transition: transform .22s; flex-shrink: 0; }
.song-card.open .song-chevron { transform: rotate(90deg); }

.marks-wrap { padding: 4px 16px 14px; display: flex; flex-wrap: wrap; gap: 7px; }
.mark-pill {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(255,215,0,.07); border: 1px solid rgba(255,215,0,.18);
  border-radius: 20px; padding: 4px 8px 4px 12px; font-size: .79rem; color: rgba(255,255,255,.8);
}
.pill-add {
  background: rgba(30,215,96,.16); border: none; border-radius: 10px;
  color: var(--green); font-size: .7rem; padding: 2px 9px; cursor: pointer; transition: background .15s;
}
.pill-add:hover { background: rgba(30,215,96,.3); }
.pill-add:disabled { opacity: .3; cursor: default; }

.empty-col { text-align: center; padding: 44px 16px; color: var(--text3); line-height: 1.7; font-size: .85rem; }
.empty-col .ei { font-size: 2rem; margin-bottom: 10px; }

/* phrases column */
.phrases-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.btn-add {
  background: var(--accent); border: none; color: #fff;
  padding: 8px 20px; border-radius: 8px; font-size: .85rem; font-weight: 600;
  transition: background .15s, transform .15s;
}
.btn-add:hover { background: #7b74ff; transform: translateY(-1px); }

.phrase-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 20px 22px; margin-bottom: 10px;
  transition: border-color .2s;
}
.phrase-card:hover { border-color: rgba(108,99,255,.35); }
.pc-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.pc-phrase { font-size: 1.05rem; font-weight: 700; margin-bottom: 5px; }
.pc-btns { display: flex; gap: 2px; flex-shrink: 0; }
.pc-btn {
  background: none; border: none; color: var(--text3); padding: 5px 8px;
  border-radius: 7px; font-size: .82rem; transition: color .15s, background .15s; line-height: 1;
}
.pc-btn:hover { color: var(--text); background: var(--surface2); }
.pc-btn.del:hover { color: var(--red); }
.pc-meaning { font-size: .87rem; color: var(--text2); margin-bottom: 8px; }
.pc-example {
  font-size: .82rem; color: var(--text3); font-style: italic;
  border-left: 2px solid var(--accent); padding-left: 10px; line-height: 1.65; margin-bottom: 8px;
}
.pc-orig {
  font-size: .8rem; color: var(--text3); font-style: italic;
  border-left: 2px solid rgba(30,215,96,.4); padding-left: 10px; line-height: 1.65; margin-bottom: 6px;
}
.pc-src { font-size: .74rem; color: var(--text3); }
.pc-song-src { font-size: .74rem; color: rgba(30,215,96,.65); display: flex; align-items: center; gap: 4px; margin-top: 4px; }

/* ── MODAL ── */
.modal-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,.72); z-index: 1000;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.modal-bg.open { opacity: 1; pointer-events: all; }
.modal {
  background: var(--surface2); border: 1px solid var(--border2); border-radius: 18px;
  padding: 36px; width: 500px; max-width: calc(100vw - 40px);
  transform: translateY(24px) scale(.97); transition: transform .25s;
}
.modal-bg.open .modal { transform: translateY(0) scale(1); }
.modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
.modal-title { font-size: 1.05rem; font-weight: 700; }
.modal-close { background: none; border: none; color: var(--text3); font-size: 1.2rem; padding: 2px 6px; border-radius: 6px; transition: color .15s; }
.modal-close:hover { color: var(--text); }
.mf { margin-bottom: 16px; }
.ml { font-size: .76rem; color: var(--text3); margin-bottom: 6px; }
.mi {
  width: 100%; background: rgba(255,255,255,.06); border: 1px solid var(--border);
  border-radius: 9px; padding: 10px 14px; color: var(--text); font-size: .9rem; outline: none;
  transition: border-color .2s;
}
.mi:focus { border-color: rgba(108,99,255,.5); }
textarea.mi { resize: vertical; min-height: 60px; }
.mfoot { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }
.btn-cancel { background: none; border: 1px solid var(--border2); color: var(--text2); padding: 9px 22px; border-radius: 9px; font-size: .87rem; transition: background .15s; }
.btn-cancel:hover { background: var(--surface3); }
.btn-save { background: var(--accent); border: none; color: #fff; padding: 9px 26px; border-radius: 9px; font-size: .87rem; font-weight: 600; transition: background .15s; }
.btn-save:hover { background: #7b74ff; }

/* ── TOAST ── */
.toast {
  position: fixed; bottom: 36px; left: 50%; transform: translateX(-50%) translateY(10px);
  background: #1e1e1e; border: 1px solid var(--border2); color: var(--text);
  padding: 10px 24px; border-radius: 24px; font-size: .87rem;
  opacity: 0; pointer-events: none; transition: opacity .22s, transform .22s; z-index: 9999;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── SONGS SEARCH ── */
.songs-search { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.songs-search-row { display: flex; gap: 8px; }
.songs-search-in {
  flex: 1; min-width: 0; background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 12px; color: var(--text); font-size: .84rem; outline: none;
  transition: border-color .2s;
}
.songs-search-in:focus { border-color: rgba(108,99,255,.4); }
.songs-search-in::placeholder { color: var(--text3); }
.songs-search-btn {
  background: var(--surface3); border: 1px solid var(--border2); color: var(--text2);
  border-radius: 8px; padding: 8px 14px; font-size: .82rem; white-space: nowrap; transition: all .15s;
}
.songs-search-btn:hover { background: rgba(30,215,96,.12); border-color: var(--green); color: var(--green); }
.songs-search-btn:disabled { opacity: .5; cursor: default; }
.sr-item {
  display: flex; align-items: center; gap: 12px; padding: 10px 14px;
  border-radius: 10px; cursor: pointer; transition: background .15s;
  border: 1px solid transparent; margin-bottom: 6px;
}
.sr-item:hover { background: var(--surface2); border-color: var(--border); }
.sr-icon { font-size: 1.1rem; flex-shrink: 0; }
.sr-info { flex: 1; min-width: 0; }
.sr-title { font-size: .88rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sr-meta { font-size: .74rem; color: var(--text3); margin-top: 2px; }

/* ── LYRICS MODAL ── */
.lm-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,.78); z-index: 800;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity .22s;
}
.lm-bg.open { opacity: 1; pointer-events: all; }
.lm-box {
  width: min(940px, calc(100vw - 48px)); height: min(82vh, 680px);
  background: var(--surface2); border: 1px solid var(--border2); border-radius: 18px;
  display: flex; flex-direction: column;
  transform: translateY(20px) scale(.97); transition: transform .25s; overflow: hidden;
}
.lm-bg.open .lm-box { transform: translateY(0) scale(1); }
.lm-header {
  display: flex; align-items: center; gap: 14px; padding: 18px 24px;
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.lm-title { flex: 1; min-width: 0; }
.lm-song-name { font-size: 1rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lm-song-artist { font-size: .78rem; color: var(--text3); margin-top: 2px; }
.lm-save-btn {
  background: rgba(30,215,96,.15); border: 1px solid rgba(30,215,96,.35);
  color: var(--green); border-radius: 8px; padding: 7px 18px; font-size: .82rem;
  font-weight: 600; white-space: nowrap; transition: all .15s; flex-shrink: 0;
}
.lm-save-btn:hover { background: rgba(30,215,96,.28); }
.lm-save-btn:disabled { opacity: .4; cursor: default; }
.lm-close { background: none; border: none; color: var(--text3); font-size: 1.2rem; padding: 4px 8px; border-radius: 7px; transition: color .15s; flex-shrink: 0; }
.lm-close:hover { color: var(--text); }
.lm-body { display: flex; flex: 1; min-height: 0; }
.lm-lyrics-col {
  flex: 1; overflow-y: auto; padding: 22px 28px;
  border-right: 1px solid var(--border);
  user-select: text; -webkit-user-select: text;
}
.lm-lyrics-col::-webkit-scrollbar { width: 4px; }
.lm-lyrics-col::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 4px; }
.lm-lyric-line { padding: 3px 0; line-height: 1.85; font-size: .9rem; color: rgba(255,255,255,.82); min-height: 26px; }
.lm-lyric-line mark.pm {
  background: rgba(255,220,0,.28); border-radius: 3px; padding: 0 2px; color: #fff; font-style: normal; cursor: pointer;
}
.lm-lyric-line mark.pm:hover { background: rgba(255,220,0,.42); }
.lm-marks-col { width: 260px; flex-shrink: 0; display: flex; flex-direction: column; padding: 20px 18px; }
.lm-marks-head { font-size: .74rem; font-weight: 700; color: var(--text3); letter-spacing: .07em; text-transform: uppercase; margin-bottom: 12px; }
.lm-marks-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 7px; min-height: 0; }
.lm-mark-pill { display: flex; align-items: center; gap: 6px; background: rgba(255,215,0,.07); border: 1px solid rgba(255,215,0,.18); border-radius: 20px; padding: 5px 8px 5px 14px; font-size: .82rem; color: rgba(255,255,255,.8); }
.lm-mark-pill span { flex: 1; min-width: 0; word-break: break-all; }
.lm-mark-rm { background: none; border: none; color: var(--text3); font-size: .78rem; padding: 2px 4px; cursor: pointer; border-radius: 4px; line-height: 1; }
.lm-mark-rm:hover { color: var(--red); }
.lm-empty-marks { color: var(--text3); font-size: .8rem; line-height: 1.75; margin-top: 4px; }
.lm-add-all { margin-top: 14px; background: var(--accent); border: none; color: #fff; border-radius: 9px; padding: 10px 16px; font-size: .84rem; font-weight: 600; transition: background .15s; }
.lm-add-all:hover { background: #7b74ff; }
.lm-add-all:disabled { opacity: .35; cursor: default; }

/* floating mark tooltip */
.mark-tooltip {
  position: fixed; z-index: 900; background: var(--accent); border-radius: 8px;
  padding: 6px 18px; font-size: .83rem; font-weight: 600; color: #fff;
  cursor: pointer; box-shadow: 0 4px 20px rgba(0,0,0,.55);
  opacity: 0; pointer-events: none; transition: opacity .12s; white-space: nowrap;
  transform: translateX(-50%);
}
.mark-tooltip::after {
  content: ''; position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%);
  border: 5px solid transparent; border-bottom: none; border-top-color: var(--accent);
}
.mark-tooltip.show { opacity: 1; pointer-events: all; }

/* ── PHRASE GROUPS ── */
.source-group { margin-bottom: 26px; }
.source-group-head { font-size: .73rem; font-weight: 700; color: var(--text3); letter-spacing: .06em; text-transform: uppercase; padding-bottom: 10px; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
.filter-badge { display: inline-flex; align-items: center; gap: 4px; background: rgba(108,99,255,.18); border: 1px solid rgba(108,99,255,.32); color: rgba(200,198,255,.9); font-size: .77rem; padding: 3px 10px; border-radius: 12px; font-weight: 600; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn-clear-filter { background: none; border: 1px solid var(--border2); color: var(--text3); padding: 4px 12px; border-radius: 8px; font-size: .78rem; transition: all .15s; cursor: pointer; }
.btn-clear-filter:hover { border-color: var(--accent); color: var(--accent); }
.song-lyrics-btn { background: none; border: 1px solid var(--border2); color: var(--text3); border-radius: 6px; padding: 4px 10px; font-size: .74rem; transition: all .15s; white-space: nowrap; flex-shrink: 0; }
.song-lyrics-btn:hover { border-color: rgba(30,215,96,.5); color: var(--green); }
.song-card.filter-active { border-color: rgba(108,99,255,.5); background: rgba(108,99,255,.07); }
.lm-copy-btn { background: none; border: 1px solid var(--border2); color: var(--text2); border-radius: 8px; padding: 7px 14px; font-size: .82rem; font-weight: 500; transition: all .15s; flex-shrink: 0; }
.lm-copy-btn:hover { border-color: rgba(255,255,255,.3); color: var(--text); }
.lm-explain-btn { margin-top: 8px; background: rgba(108,99,255,.14); border: 1px solid rgba(108,99,255,.28); color: rgba(190,186,255,.9); border-radius: 9px; padding: 9px 16px; font-size: .84rem; font-weight: 600; transition: all .15s; }
.lm-explain-btn:hover { background: rgba(108,99,255,.26); }
.lm-explain-btn:disabled { opacity: .32; cursor: default; }
.lm-ai-result { background: rgba(108,99,255,.09); border: 1px solid rgba(108,99,255,.18); border-radius: 10px; padding: 12px 14px; margin-top: 10px; font-size: .81rem; color: rgba(255,255,255,.8); line-height: 1.72; max-height: 220px; overflow-y: auto; }
.lm-ai-result p { margin: 0 0 5px; }
.lm-ai-result p:last-child { margin-bottom: 0; }
</style>
</head>
<body>

<div id="toast" class="toast"></div>

<!-- SITE HEADER -->
<header class="site-header">
  <div class="brand">
    <span class="brand-logo">🎵</span>
    <span class="brand-name">SpeakUp <em>Artists</em></span>
  </div>
  <div class="header-search" id="hdr-search">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
    <input class="search-in" id="search-in" placeholder="搜索艺人…" oninput="filterArtists()">
  </div>
  <nav class="header-nav" id="hdr-nav"></nav>
</header>

<!-- VIEW: LIST -->
<div id="v-list" class="view active">
  <div class="list-wrap">
    <div class="list-heading">
      <h1>艺人语料库</h1>
      <p>通过歌词学地道英语，深入了解每位艺人的语言风格与俚语</p>
    </div>
    <div id="artist-grid" class="artist-grid"></div>
    <div id="no-results" class="no-results">未找到匹配的艺人</div>
  </div>
</div>

<!-- VIEW: ARTIST DETAIL -->
<div id="v-artist" class="view">
  <div class="detail-header">
    <button class="back-btn" onclick="backToList()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      艺人库
    </button>
    <span class="sep">›</span>
    <span class="breadcrumb" id="bc"></span>
  </div>
  <div class="hero-wrap" id="hero-wrap">
    <div class="hero-inner" id="hero-inner"></div>
  </div>
  <div class="detail-body">
    <div class="col-songs" id="col-songs"></div>
    <div id="col-phrases"></div>
  </div>
</div>

<!-- LYRICS MODAL -->
<div class="lm-bg" id="lm-bg" onclick="onLmBgClick(event)">
  <div class="lm-box">
    <div class="lm-header">
      <div class="lm-title">
        <div class="lm-song-name" id="lm-song-name">—</div>
        <div class="lm-song-artist" id="lm-song-artist"></div>
      </div>
      <button class="lm-copy-btn" onclick="copyLyrics()">复制歌词</button>
      <button class="lm-save-btn" id="lm-save-btn" onclick="saveSong()">＋ 保存到曲库</button>
      <button class="lm-close" onclick="closeLyricsModal()">✕</button>
    </div>
    <div class="lm-body">
      <div class="lm-lyrics-col" id="lm-lyrics-col"></div>
      <div class="lm-marks-col">
        <div class="lm-marks-head">已标记</div>
        <div class="lm-marks-list" id="lm-marks-list"></div>
        <button class="lm-explain-btn" id="lm-explain-btn" onclick="explainMarked()" disabled>AI 解释</button>
        <div class="lm-ai-result" id="lm-ai-result" style="display:none"></div>
        <button class="lm-add-all" id="lm-add-all-btn" onclick="addAllMarkedToVocab()" disabled>加入语料库</button>
      </div>
    </div>
  </div>
</div>
<div class="mark-tooltip" id="mark-tooltip" onclick="markSelection()">标记</div>

<!-- MODAL: ADD / EDIT PHRASE -->
<div class="modal-bg" id="modal-bg" onclick="onModalBgClick(event)">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="modal-title">添加语料</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="mf"><div class="ml">词汇 / 短语</div><input class="mi" id="m-phrase" type="text" placeholder="e.g. YOLO"></div>
    <div class="mf"><div class="ml">中文释义</div><textarea class="mi" id="m-meaning" placeholder="中文意思…"></textarea></div>
    <div class="mf"><div class="ml">例句</div><textarea class="mi" id="m-example" placeholder="英文例句…"></textarea></div>
    <div class="mf"><div class="ml">来源</div><input class="mi" id="m-source" type="text" placeholder="歌曲 / 专辑名"></div>
    <div class="mfoot">
      <button class="btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn-save" onclick="saveModal()">保存</button>
    </div>
  </div>
</div>

<script>
// ─── STATIC DATA ─────────────────────────────────────────────────────────────
const ARTISTS = [
  {
    id: "drake", name: "Drake", avatar: "🦉", color: "#b8860b",
    origin: "Toronto, Canada · 多伦多", style: "Hip-Hop · R&B · Rap",
    desc: "Aubrey Drake Graham，出道于 2006 年，以情感细腻的歌词和双重身份（说唱+演唱）著称。他普及了大量加拿大俚语和新词，是当代流行英语的重要塑造者之一。",
    tags: ["Toronto slang","Emotional rap","R&B","YOLO era"],
    phrases: [
      { phrase:"YOLO", meaning:"You Only Live Once，活在当下，及时行乐", example:"We're going skydiving tomorrow — YOLO!", source:"The Motto (2011)" },
      { phrase:"Started from the bottom", meaning:"从底层白手起家", example:"I started from the bottom, now I'm running this company.", source:"Started From the Bottom (2013)" },
      { phrase:"No new friends", meaning:"不需要新朋友，只信原来的兄弟", example:"I don't trust easily — no new friends.", source:"No New Friends (2013)" },
      { phrase:"Know yourself, know your worth", meaning:"了解自己，认清自身价值", example:"Don't let anyone underestimate you. Know yourself, know your worth.", source:"0 to 100 (2014)" },
      { phrase:"0 to 100", meaning:"瞬间从零状态爆发到满状态", example:"He went from 0 to 100 real quick when they disrespected him.", source:"0 to 100 / The Catch Up (2014)" },
      { phrase:"God's plan", meaning:"一切都是命中注定，自有安排", example:"I didn't plan any of this — it's God's plan.", source:"God's Plan (2018)" },
      { phrase:"In my feelings", meaning:"陷入情绪中，多愁善感", example:"Sorry for texting you at 2am, I was in my feelings.", source:"In My Feelings (2018)" },
      { phrase:"Woes", meaning:"死党，最亲近的兄弟", example:"I only ride with my woes — people who've been there from day one.", source:"Know Yourself (2015)" },
      { phrase:"The 6 / The 6ix", meaning:"多伦多的别称（来自416区号）", example:"Reppin' the 6 wherever I go.", source:"Know Yourself (2015)" },
      { phrase:"More life", meaning:"祝你活得更好，长命百岁（多伦多祝福语）", example:"More life to you and everyone you love.", source:"More Life (2017)" },
      { phrase:"Real one", meaning:"真朋友，靠得住的人", example:"She's been there through everything — she's a real one.", source:"Crew Love (2011)" },
      { phrase:"Charged up", meaning:"充满能量，准备好了，斗志昂扬", example:"I've been in the gym every day — I'm charged up for this season.", source:"Charged Up (2015)" },
      { phrase:"Hotline bling", meaning:"不停地打电话/发消息联系某人", example:"He's always on my hotline bling — can't get a moment to myself.", source:"Hotline Bling (2015)" },
      { phrase:"I'm on one", meaning:"我状态来了，我在飘，情绪高涨", example:"Don't talk to me right now, I'm on one.", source:"I'm On One (2011)" },
      { phrase:"Running through the 6 with my woes", meaning:"和兄弟们在城里混，在本地闯荡", example:"Every weekend we're running through the city with the crew.", source:"Know Yourself (2015)" },
    ]
  }
];

// ─── STORAGE ─────────────────────────────────────────────────────────────────
const PHRASES_KEY = "artist_site_phrases";
const SONGS_KEY   = "speakup_songs";

function getPhrases(id) {
  try {
    const all = JSON.parse(localStorage.getItem(PHRASES_KEY) || "{}");
    if (all[id]) return all[id];
  } catch {}
  const a = ARTISTS.find(x => x.id === id);
  return a ? a.phrases.map(p => ({ ...p })) : [];
}
function savePhrases(id, phrases) {
  try {
    const all = JSON.parse(localStorage.getItem(PHRASES_KEY) || "{}");
    all[id] = phrases;
    localStorage.setItem(PHRASES_KEY, JSON.stringify(all));
  } catch {}
}
function getSongs() {
  try { return JSON.parse(localStorage.getItem(SONGS_KEY) || "[]"); } catch { return []; }
}
function songsByArtist(name) {
  const low = name.toLowerCase().trim();
  return getSongs().filter(s => {
    const sl = (s.artist || "").toLowerCase().trim();
    return sl === low || sl.includes(low) || low.includes(sl);
  });
}

// ─── UTILS ───────────────────────────────────────────────────────────────────
const esc = s => String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const ea  = s => String(s||"").replace(/\\/g,"\\\\").replace(/'/g,"\\'");

let _tTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(_tTimer);
  _tTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

// ─── ROUTING ─────────────────────────────────────────────────────────────────
let _curArtist = null;

function show(name) {
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  document.getElementById("v-" + name).classList.add("active");
  const isDetail = name === "artist";
  document.getElementById("hdr-search").style.display = isDetail ? "none" : "";
  document.getElementById("hdr-nav").innerHTML = isDetail ? `` : ``;
  document.title = isDetail && _curArtist
    ? `${_curArtist.name} · SpeakUp Artists`
    : "SpeakUp · Artists";
}

// ─── LIST ─────────────────────────────────────────────────────────────────────
function renderList() {
  _curArtist = null;
  show("list");
  document.getElementById("search-in").value = "";
  document.getElementById("artist-grid").innerHTML = ARTISTS.map(a => {
    const sc = songsByArtist(a.name).length;
    const pc = getPhrases(a.id).length;
    return `<div class="artist-card" style="--c:${a.color}" onclick="openArtist('${a.id}')">
      <div class="ac-avatar">${a.avatar}</div>
      <div class="ac-name">${esc(a.name)}</div>
      <div class="ac-sub">${esc(a.origin)}</div>
      <div class="ac-desc">${esc(a.desc)}</div>
      <div class="ac-stats">
        <div class="ac-stat"><b>${pc}</b> 条语料</div>
        <div class="ac-stat"><b>${a.tags.length}</b> 标签</div>
        ${sc ? `<div class="ac-stat" style="color:var(--green)"><b>${sc}</b> 首歌</div>` : ""}
      </div>
    </div>`;
  }).join("");
}

function filterArtists() {
  const q = document.getElementById("search-in").value.toLowerCase();
  let n = 0;
  document.querySelectorAll(".artist-card").forEach(c => {
    const ok = !q || c.textContent.toLowerCase().includes(q);
    c.style.display = ok ? "" : "none";
    if (ok) n++;
  });
  document.getElementById("no-results").style.display = n ? "none" : "";
}

function backToList() { renderList(); }

// ─── DETAIL ───────────────────────────────────────────────────────────────────
function openArtist(id) {
  const a = ARTISTS.find(x => x.id === id);
  if (!a) return;
  _curArtist = a;
  _phraseFilter = null;
  show("artist");
  document.getElementById("bc").textContent = a.name;

  // Hero
  document.getElementById("hero-wrap").style.cssText = `--c:${a.color}`;
  document.getElementById("hero-inner").innerHTML = `
    <div class="hero-avatar">${a.avatar}</div>
    <div class="hero-info">
      <div class="hero-name">${esc(a.name)}</div>
      <div class="hero-sub">${esc(a.origin)} · ${esc(a.style)}</div>
      <div class="hero-desc">${esc(a.desc)}</div>
      <div class="tag-row">${a.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
    </div>`;

  renderSongs(a);
  renderPhrases(id);
}

function renderSongs(a) {
  const songs = songsByArtist(a.name);
  const col = document.getElementById("col-songs");
  const searchHtml = `<div class="songs-search">
    <div class="songs-search-row">
      <input class="songs-search-in" id="song-search-artist" type="text" placeholder="歌手名…"
             value="${esc(a.name)}" onkeydown="if(event.key==='Enter')searchSong()" style="flex:0 0 120px">
      <input class="songs-search-in" id="song-search-in" type="text" placeholder="歌曲名…"
             onkeydown="if(event.key==='Enter')searchSong()">
      <button class="songs-search-btn" id="song-search-btn" onclick="searchSong()">搜索</button>
    </div>
  </div>
  <div id="sr-list"></div>`;

  if (!songs.length) {
    col.innerHTML = `<div class="col-head"><span class="col-title">曲库</span></div>
      ${searchHtml}
      <div class="empty-col" style="margin-top:8px"><div class="ei">🎵</div>暂无保存歌曲<br><span style="font-size:.78rem;opacity:.55">搜索歌词并保存</span></div>`;
    return;
  }
  const existing = getPhrases(a.id).map(p => p.phrase.toLowerCase());
  col.innerHTML = `<div class="col-head">
      <span class="col-title">曲库</span>
      <span class="col-count">${songs.length} 首</span>
    </div>
    ${searchHtml}
    ${songs.map(s => {
      const marks = (s.markedPhrases || []).filter(p => p.trim());
      const marksHtml = marks.length ? `<div class="marks-wrap">${marks.map(p => {
        const orig = s.lines.find(l => l.toLowerCase().includes(p.toLowerCase())) || "";
        const has = existing.includes(p.toLowerCase());
        return `<span class="mark-pill">${esc(p)}
          ${has
            ? `<button class="pill-add" disabled>已添加</button>`
            : `<button class="pill-add" onclick="event.stopPropagation();addFromSong('${ea(a.id)}',${s.id},'${ea(p)}','${ea(s.title)}','${ea(orig)}')">＋</button>`
          }</span>`;
      }).join("")}</div>` : "";
      return `<div class="song-card" id="sc-${s.id}" onclick="filterBySong(${s.id},'${ea(s.title)}')" style="cursor:pointer">
        <div class="song-header">
          <div class="song-icon">🎵</div>
          <div class="song-info">
            <div class="song-title">${esc(s.title)}</div>
            <div class="song-meta">${s.lines.filter(l=>l.trim()).length} 行歌词${marks.length ? ` · ${marks.length} 个标记` : ""}</div>
          </div>
          <button class="song-lyrics-btn" onclick="event.stopPropagation();openSavedSongInModal(${s.id})">查看歌词</button>
        </div>
        ${marksHtml}
      </div>`;
    }).join("")}`;
}

function addFromSong(artistId, songId, phrase, song, orig) {
  const phrases = getPhrases(artistId);
  if (phrases.some(p => p.phrase.toLowerCase() === phrase.toLowerCase())) { toast(`"${phrase}" 已在语料库中`); return; }
  phrases.push({ phrase, meaning: "", example: "", source: song, lyricsSource: song, originalLine: orig, songId });
  savePhrases(artistId, phrases);
  const a = ARTISTS.find(x => x.id === artistId);
  renderSongs(a);
  renderPhrases(artistId);
  toast(`"${phrase}" 已加入语料，可点击编辑补充释义`);
}

let _phraseFilter = null; // { id: songId, title }

function renderPhrases(artistId) {
  const allPhrases = getPhrases(artistId);
  const col = document.getElementById("col-phrases");

  if (_phraseFilter) {
    const filtered = allPhrases.map((p, i) => ({ ...p, _i: i }))
      .filter(p => _matchesSongFilter(p, _phraseFilter));
    col.innerHTML = `<div class="phrases-bar">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <span class="col-title">语料</span>
        <span class="filter-badge">🎵 ${esc(_phraseFilter.title)}</span>
        <button class="btn-clear-filter" onclick="clearPhraseFilter()">✕ 全部</button>
        <span class="col-count">${filtered.length} 条</span>
      </div>
      <button class="btn-add" onclick="openModal('${ea(artistId)}',null)">＋ 添加</button>
    </div>
    ${filtered.length
      ? filtered.map(p => _phraseCard(p, p._i, artistId, true)).join("")
      : `<div class="empty-col"><div class="ei">🎵</div>此歌曲暂无语料<br>打开歌词页面标记词汇</div>`}`;
    return;
  }

  // All phrases grouped by source
  const indexed = allPhrases.map((p, i) => ({ ...p, _i: i }));
  const groups = {};
  indexed.forEach(p => {
    const key = p.lyricsSource || p.source || "其他";
    if (!groups[key]) groups[key] = [];
    groups[key].push(p);
  });
  const groupHtml = Object.entries(groups).map(([src, items]) =>
    `<div class="source-group">
      <div class="source-group-head">🎵 ${esc(src)}</div>
      ${items.map(p => _phraseCard(p, p._i, artistId, false)).join("")}
    </div>`
  ).join("");

  col.innerHTML = `<div class="phrases-bar">
    <div style="display:flex;align-items:center;gap:10px">
      <span class="col-title">语料</span>
      <span class="col-count">${allPhrases.length} 条</span>
    </div>
    <button class="btn-add" onclick="openModal('${ea(artistId)}',null)">＋ 添加语料</button>
  </div>
  ${allPhrases.length ? groupHtml : `<div class="empty-col"><div class="ei">💬</div>暂无语料<br>点击右上角添加</div>`}`;
}

function _phraseCard(p, idx, artistId, showSrc) {
  const src = showSrc
    ? (p.lyricsSource
        ? `<div class="pc-song-src">🎵 ${esc(p.lyricsSource)}</div>`
        : (p.source ? `<div class="pc-src">来自：${esc(p.source)}</div>` : ""))
    : "";
  return `<div class="phrase-card">
    <div class="pc-row">
      <div class="pc-phrase">${esc(p.phrase)}</div>
      <div class="pc-btns">
        <button class="pc-btn" onclick="openModal('${ea(artistId)}',${idx})" title="编辑">✏</button>
        <button class="pc-btn del" onclick="delPhrase('${ea(artistId)}',${idx})" title="删除">✕</button>
      </div>
    </div>
    ${p.meaning ? `<div class="pc-meaning">${esc(p.meaning)}</div>` : ""}
    ${p.originalLine ? `<div class="pc-orig">${esc(p.originalLine)}</div>` : ""}
    ${p.example ? `<div class="pc-example">${esc(p.example)}</div>` : ""}
    ${src}
  </div>`;
}

function _matchesSongFilter(phrase, filter) {
  if (phrase.songId && phrase.songId === filter.id) return true;
  const src = ((phrase.lyricsSource || phrase.source || "")).toLowerCase();
  const tl = filter.title.toLowerCase();
  return src.startsWith(tl) || src.includes(tl);
}

function filterBySong(songId, title) {
  if (_phraseFilter && _phraseFilter.id === songId) { clearPhraseFilter(); return; }
  _phraseFilter = { id: songId, title };
  document.querySelectorAll(".song-card").forEach(c => c.classList.remove("filter-active"));
  document.getElementById("sc-" + songId)?.classList.add("filter-active");
  if (_curArtist) renderPhrases(_curArtist.id);
}

function clearPhraseFilter() {
  _phraseFilter = null;
  document.querySelectorAll(".song-card").forEach(c => c.classList.remove("filter-active"));
  if (_curArtist) renderPhrases(_curArtist.id);
}

function delPhrase(artistId, idx) {
  if (!confirm("删除此语料？")) return;
  const phrases = getPhrases(artistId);
  phrases.splice(idx, 1);
  savePhrases(artistId, phrases);
  renderPhrases(artistId);
  const a = ARTISTS.find(x => x.id === artistId);
  if (a) renderSongs(a);
  toast("已删除");
}

// ─── MODAL ───────────────────────────────────────────────────────────────────
let _mArtist = null, _mIdx = null;

function openModal(artistId, idx) {
  _mArtist = artistId; _mIdx = idx;
  const phrases = getPhrases(artistId);
  const p = idx !== null ? phrases[idx] : {};
  document.getElementById("modal-title").textContent = idx !== null ? "编辑语料" : "添加语料";
  document.getElementById("m-phrase").value  = p.phrase  || "";
  document.getElementById("m-meaning").value = p.meaning || "";
  document.getElementById("m-example").value = p.example || "";
  document.getElementById("m-source").value  = p.source  || "";
  document.getElementById("modal-bg").classList.add("open");
  setTimeout(() => document.getElementById("m-phrase").focus(), 50);
}

function closeModal() { document.getElementById("modal-bg").classList.remove("open"); }

function onModalBgClick(e) {
  if (e.target === document.getElementById("modal-bg")) closeModal();
}

function saveModal() {
  const phrase = document.getElementById("m-phrase").value.trim();
  if (!phrase) { document.getElementById("m-phrase").focus(); return; }
  const phrases = getPhrases(_mArtist);
  const obj = {
    phrase,
    meaning: document.getElementById("m-meaning").value.trim(),
    example: document.getElementById("m-example").value.trim(),
    source:  document.getElementById("m-source").value.trim(),
  };
  if (_mIdx !== null) {
    obj.lyricsSource  = phrases[_mIdx].lyricsSource;
    obj.originalLine  = phrases[_mIdx].originalLine;
    phrases[_mIdx] = obj;
  } else {
    phrases.unshift(obj);
  }
  savePhrases(_mArtist, phrases);
  closeModal();
  renderPhrases(_mArtist);
  const a = ARTISTS.find(x => x.id === _mArtist);
  if (a) renderSongs(a);
  toast(_mIdx !== null ? "语料已更新" : "语料已添加");
}

document.addEventListener("keydown", e => {
  if (document.getElementById("lm-bg").classList.contains("open")) {
    if (e.key === "Escape") { closeLyricsModal(); return; }
  }
  if (!document.getElementById("modal-bg").classList.contains("open")) return;
  if (e.key === "Escape") closeModal();
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) saveModal();
});

// ─── SONGS STORAGE ───────────────────────────────────────────────────────────
function setSongs(arr) { localStorage.setItem(SONGS_KEY, JSON.stringify(arr)); }

// ─── LYRICS SEARCH ───────────────────────────────────────────────────────────
let _srResults = [];

async function searchSong() {
  if (!_curArtist) return;
  const titleEl = document.getElementById("song-search-in");
  const artistEl = document.getElementById("song-search-artist");
  const btn = document.getElementById("song-search-btn");
  const title = titleEl.value.trim();
  if (!title) { titleEl.focus(); return; }
  btn.disabled = true; btn.textContent = "搜索中…";
  try {
    const artistName = artistEl ? artistEl.value.trim() : _curArtist.name;
    const params = new URLSearchParams({ track_name: title });
    if (artistName) params.append("artist_name", artistName);
    const res = await fetch("https://lrclib.net/api/search?" + params);
    if (!res.ok) throw new Error("网络错误");
    const results = await res.json();
    _srResults = results.filter(r => r.plainLyrics);
    renderSearchResults();
  } catch {
    const c = document.getElementById("sr-list");
    if (c) c.innerHTML = `<div style="color:var(--text3);font-size:.82rem;padding:6px 2px">搜索失败，请重试</div>`;
  } finally {
    btn.disabled = false; btn.textContent = "搜索";
  }
}

function renderSearchResults() {
  const c = document.getElementById("sr-list");
  if (!c) return;
  if (!_srResults.length) {
    c.innerHTML = `<div style="color:var(--text3);font-size:.82rem;padding:6px 2px">未找到歌词，试试英文歌名</div>`; return;
  }
  c.innerHTML = _srResults.slice(0, 6).map((r, i) => `
    <div class="sr-item" onclick="openLyricsFromResult(${i})">
      <div class="sr-icon">🎵</div>
      <div class="sr-info">
        <div class="sr-title">${esc(r.trackName)}</div>
        <div class="sr-meta">${esc(r.artistName)} · ${(r.plainLyrics||"").split("\n").filter(l=>l.trim()).length} 行</div>
      </div>
    </div>`).join("");
}

// ─── LYRICS MODAL STATE ──────────────────────────────────────────────────────
let _lmTrack = null;
let _lmLines = [];
let _lmMarks = [];
let _lmSongId = null;
let _lmSaved  = false;

function openLyricsFromResult(idx) {
  const r = _srResults[idx];
  if (!r) return;
  _lmLines = (r.plainLyrics || "").split("\n");
  _lmTrack = { title: r.trackName, artist: r.artistName };
  _lmMarks = [];
  const songs = getSongs();
  const key = ((r.artistName||"")+"|"+(r.trackName||"")).toLowerCase();
  const existing = songs.find(s => (((s.artist||"")+"|"+(s.title||"")).toLowerCase()) === key);
  _lmSaved = !!existing;
  _lmSongId = existing ? existing.id : null;
  if (existing) _lmMarks = existing.markedPhrases ? [...existing.markedPhrases] : [];
  _openLyricsModal();
}

function openSavedSongInModal(songId) {
  const song = getSongs().find(s => s.id === songId);
  if (!song) return;
  _lmLines = song.lines || [];
  _lmTrack = { title: song.title, artist: song.artist };
  _lmMarks = song.markedPhrases ? [...song.markedPhrases] : [];
  _lmSongId = songId;
  _lmSaved = true;
  _openLyricsModal();
}

function _openLyricsModal() {
  document.getElementById("lm-song-name").textContent = _lmTrack.title || "Unknown";
  document.getElementById("lm-song-artist").textContent = _lmTrack.artist || "";
  const saveBtn = document.getElementById("lm-save-btn");
  saveBtn.textContent = _lmSaved ? "✓ 已保存" : "＋ 保存到曲库";
  saveBtn.disabled = _lmSaved;
  _renderLyricsInModal();
  _renderMarksPanel();
  document.getElementById("lm-bg").classList.add("open");
}

function closeLyricsModal() {
  document.getElementById("lm-bg").classList.remove("open");
  _hideMarkTooltip();
  if (_curArtist) renderSongs(_curArtist);
}

function onLmBgClick(e) {
  if (e.target === document.getElementById("lm-bg")) closeLyricsModal();
}

function _applyMarks(text, marks) {
  if (!marks.length) return esc(text);
  const ranges = [];
  marks.forEach(m => {
    const re = new RegExp(m.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
    let match;
    while ((match = re.exec(text)) !== null) ranges.push([match.index, match.index + match[0].length]);
  });
  if (!ranges.length) return esc(text);
  ranges.sort((a, b) => a[0] - b[0]);
  const merged = [ranges[0]];
  for (let i = 1; i < ranges.length; i++) {
    const last = merged[merged.length - 1];
    if (ranges[i][0] <= last[1]) last[1] = Math.max(last[1], ranges[i][1]);
    else merged.push(ranges[i]);
  }
  let out = "", pos = 0;
  merged.forEach(([s, e]) => {
    out += esc(text.slice(pos, s));
    out += `<mark class="pm">${esc(text.slice(s, e))}</mark>`;
    pos = e;
  });
  return out + esc(text.slice(pos));
}

function _renderLyricsInModal() {
  document.getElementById("lm-lyrics-col").innerHTML = _lmLines.map(l =>
    `<div class="lm-lyric-line">${l.trim() ? _applyMarks(l.trim(), _lmMarks) : ""}</div>`
  ).join("");
}

function _renderMarksPanel() {
  const list = document.getElementById("lm-marks-list");
  const addBtn = document.getElementById("lm-add-all-btn");
  const expBtn = document.getElementById("lm-explain-btn");
  const aiRes = document.getElementById("lm-ai-result");
  if (!_lmMarks.length) {
    list.innerHTML = `<div class="lm-empty-marks">在左侧选中歌词文字，点击「标记」将词汇添加到此处</div>`;
    addBtn.disabled = true;
    if (expBtn) expBtn.disabled = true;
    if (aiRes) aiRes.style.display = "none";
    return;
  }
  list.innerHTML = _lmMarks.map((m, i) => `
    <div class="lm-mark-pill">
      <span>${esc(m)}</span>
      <button class="lm-mark-rm" onclick="removeMarked(${i})">✕</button>
    </div>`).join("");
  addBtn.disabled = false;
  if (expBtn) expBtn.disabled = false;
}

function removeMarked(idx) {
  _lmMarks.splice(idx, 1);
  _renderLyricsInModal();
  _renderMarksPanel();
  if (_lmSaved) _updateSavedSongMarks();
}

function _updateSavedSongMarks() {
  if (!_lmSongId) return;
  const songs = getSongs();
  const s = songs.find(x => x.id === _lmSongId);
  if (s) { s.markedPhrases = [..._lmMarks]; setSongs(songs); }
}

function saveSong() {
  if (!_lmTrack || !_lmLines.length) return;
  const songs = getSongs();
  const key = ((_lmTrack.artist||"")+"|"+(_lmTrack.title||"")).toLowerCase();
  if (songs.some(s => (((s.artist||"")+"|"+(s.title||"")).toLowerCase()) === key)) {
    toast("已保存过这首歌"); return;
  }
  const id = Date.now();
  songs.unshift({ id, title: _lmTrack.title, artist: _lmTrack.artist, lines: _lmLines, markedPhrases: [..._lmMarks] });
  setSongs(songs);
  _lmSongId = id; _lmSaved = true;
  document.getElementById("lm-save-btn").textContent = "✓ 已保存";
  document.getElementById("lm-save-btn").disabled = true;
  toast("歌曲已保存");
}

function addAllMarkedToVocab() {
  if (!_lmMarks.length || !_curArtist) return;
  const phrases = getPhrases(_curArtist.id);
  let added = 0;
  _lmMarks.forEach(m => {
    if (phrases.some(p => p.phrase.toLowerCase() === m.toLowerCase())) return;
    const origLine = (_lmLines.find(l => l.toLowerCase().includes(m.toLowerCase())) || "").trim();
    const src = _lmTrack.title + (_lmTrack.artist ? " — " + _lmTrack.artist : "");
    phrases.unshift({ phrase: m, meaning: "", example: "", source: src, lyricsSource: src, originalLine: origLine, songId: _lmSongId });
    added++;
  });
  savePhrases(_curArtist.id, phrases);
  renderPhrases(_curArtist.id);
  closeLyricsModal();
  toast(added ? `${added} 条语料已加入语料库，可点击编辑补充释义` : "都已添加过了");
}

// ─── TEXT SELECTION → MARK ───────────────────────────────────────────────────
let _selText = "";

function _showMarkTooltip(x, y, text) {
  _selText = text;
  const tt = document.getElementById("mark-tooltip");
  tt.style.left = x + "px";
  tt.style.top = (y - 44) + "px";
  tt.classList.add("show");
}

function _hideMarkTooltip() {
  document.getElementById("mark-tooltip").classList.remove("show");
  _selText = "";
}

function markSelection() {
  const text = _selText.trim();
  if (!text) return;
  _hideMarkTooltip();
  if (_lmMarks.some(m => m.toLowerCase() === text.toLowerCase())) { toast("已标记"); return; }
  _lmMarks.push(text);
  _renderLyricsInModal();
  _renderMarksPanel();
  if (_lmSaved) _updateSavedSongMarks();
  window.getSelection()?.removeAllRanges();
}

document.addEventListener("mouseup", e => {
  if (!document.getElementById("lm-bg").classList.contains("open")) return;
  if (e.target.closest(".mark-tooltip")) return;
  // Only show tooltip when selection ends within the lyrics column
  if (!e.target.closest(".lm-lyrics-col")) { _hideMarkTooltip(); return; }
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed) { _hideMarkTooltip(); return; }
  const text = sel.toString().trim();
  if (!text || !sel.rangeCount) { _hideMarkTooltip(); return; }
  const rect = sel.getRangeAt(0).getBoundingClientRect();
  _showMarkTooltip((rect.left + rect.right) / 2, rect.top + window.scrollY, text);
});

document.addEventListener("mousedown", e => {
  if (e.target.closest(".mark-tooltip")) return;
  _hideMarkTooltip();
});

// ─── COPY LYRICS ─────────────────────────────────────────────────────────────
function copyLyrics() {
  const text = _lmLines.join("\n");
  const doFallback = () => {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.cssText = "position:fixed;opacity:0";
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { document.execCommand("copy"); toast("歌词已复制"); } catch { toast("复制失败"); }
    document.body.removeChild(ta);
  };
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => toast("歌词已复制")).catch(doFallback);
  else doFallback();
}

// ─── AI EXPLAIN ──────────────────────────────────────────────────────────────
function getApiKey() { return localStorage.getItem("speakup_apikey") || ""; }

async function explainMarked() {
  if (!_lmMarks.length) return;
  let key = getApiKey();
  if (!key) {
    key = prompt("请输入 Claude API Key（sk-ant-...）：");
    if (!key) return;
    localStorage.setItem("speakup_apikey", key.trim());
    key = key.trim();
  }
  const btn = document.getElementById("lm-explain-btn");
  const resultEl = document.getElementById("lm-ai-result");
  btn.disabled = true; btn.textContent = "解释中…";
  resultEl.style.display = "none";

  const songCtx = _lmTrack ? `歌曲《${_lmTrack.title}》${_lmTrack.artist ? "by " + _lmTrack.artist : ""}` : "";
  const userMsg = `你是英语学习助手。${songCtx ? `以下短语来自${songCtx}，` : ""}请用简洁中文解释以下英语短语的含义和典型用法：\n${_lmMarks.map((p, i) => `${i + 1}. ${p}`).join("\n")}`;

  try {
    const resp = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "x-api-key": key,
        "anthropic-version": "2023-06-01",
        "content-type": "application/json",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({ model: "claude-haiku-4-5-20251001", max_tokens: 900, messages: [{ role: "user", content: userMsg }] })
    });
    const data = await resp.json();
    if (data.error) throw new Error(data.error.message);
    const text = data.content?.[0]?.text || "无返回";
    resultEl.style.display = "block";
    resultEl.innerHTML = text.split("\n").filter(l => l.trim()).map(l => `<p>${esc(l)}</p>`).join("");
  } catch (err) {
    toast("AI 解释失败：" + err.message);
  } finally {
    btn.disabled = !_lmMarks.length;
    btn.textContent = "AI 解释";
  }
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
renderList();
</script>
